name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore StayGenie/StayGenie.csproj

      - name: Build backend
        run: dotnet build StayGenie/StayGenie.csproj --no-restore --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: staygenie-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: staygenie-ui

      - name: Build frontend
        run: npm run build
        working-directory: staygenie-ui